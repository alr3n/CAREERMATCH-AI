name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careermatch
          POSTGRES_PASSWORD: careermatch
          POSTGRES_DB: careermatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careermatch" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://careermatch:careermatch@localhost:5432/careermatch_test
      TEST_DATABASE_URL: postgresql+psycopg://careermatch:careermatch@localhost:5432/careermatch_test
      SECRET_KEY: ci-secret-key-that-is-long-enough-for-hs256
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check app tests
          cd ../scripts && ruff check .
      - name: Migrations apply cleanly on PostgreSQL
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Tests (PostgreSQL)
        run: pytest
      - name: Tests (SQLite)
        run: TEST_DATABASE_URL= pytest -q
      - name: Evaluation report is reproducible
        run: |
          cd .. && python scripts/evaluate_matching.py --out /tmp/report.json
          python - <<'EOF'
          import json
          a = json.load(open("/tmp/report.json")); b = json.load(open("ml/artifacts/evaluation_report.json"))
          for r in (a, b):
              r.pop("evaluated_at"); r.pop("performance")
          assert a == b, "Committed evaluation report differs from a fresh run"
          EOF

  backend-py314:
    # Python 3.14 resolves newer pins (see backend/requirements.txt markers); make sure they keep working.
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key-that-is-long-enough-for-hs256
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: "pip install --only-binary=:all: -r requirements-dev.txt"
      - name: Tests (SQLite)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - working-directory: frontend
        env:
          CI: "true"
          E2E_PYTHON: python
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
