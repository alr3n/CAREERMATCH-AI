# Live job-source check: runs the real backend against the real provider APIs.
#
# Not part of regular CI because it depends on third-party availability.
# Start it from the Actions tab ("Run workflow"). It is read-only: results are
# printed to the job summary and as notice annotations; nothing is pushed.
name: Live job sources

on:
  workflow_dispatch:
  push:
    branches: [feature/live-job-listings]
    paths:
      - "backend/app/integrations/**"
      - "backend/app/services/job_service.py"
      - "scripts/live_source_check.py"
      - ".github/workflows/live-sources.yml"

permissions:
  contents: read

concurrency:
  group: live-sources
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: development
      DATABASE_URL: sqlite:///${{ github.workspace }}/backend/live.db
      SECRET_KEY: live-check-secret-key-long-enough-for-hs256
      AUTO_REFRESH_MINUTES: "0"
      EMBEDDING_BACKEND: lsa
      # Optional: set a repository secret JSEARCH_API_KEY and variable JSEARCH_QUERIES
      # to include JSearch (postings from LinkedIn, Indeed, Glassdoor, JobStreet).
      JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
      JSEARCH_QUERIES: ${{ vars.JSEARCH_QUERIES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Migrate
        working-directory: backend
        run: alembic upgrade head
      - name: Run live check
        working-directory: backend
        run: python ../scripts/live_source_check.py --out ../live-report --annotations
      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("live-report/report.json"))
          print("## Live job sources\n")
          print("| Source | Status | Kept | Filtered out | New | Message |\n|---|---|---|---|---|---|")
          for x in r["first_refresh"]:
              print(f"| {x['provider']}/{x['identifier']} | {x['status']} | {x['fetched']} | {x['filtered_out']} | {x['created']} | {x['message'] or ''} |")
          print("\n```json\n" + json.dumps(r["integrity"], indent=2) + "\n```")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-report
          path: |
            live-report/report.json
            backend/live.db
          retention-days: 7
