[project]
name = "careermatch-ai-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["no_fixture_listings: run without the offline fixture provider (production-like provider set)"]

[tool.ruff]
line-length = 135
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I001", "UP"]
# Curated data tables and long user-facing messages
"app/ml/taxonomy.py" = ["E501"]
"app/ml/learning_resources.py" = ["E501"]
"app/ml/job_parser.py" = ["E501"]
"app/ml/profile_extractor.py" = ["E501"]
"app/integrations/jobs/demo.py" = ["E501"]
"tests/*" = ["E501"]
