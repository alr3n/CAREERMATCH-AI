[project]
name = "careermatch-ai-backend"
version = "0.1.0"
requires-python = ">=3.11"
# Runtime deps (mirrors requirements.txt) so Vercel/uv install them from pyproject.toml.
dependencies = [
    'fastapi==0.115.6',
    'uvicorn[standard]==0.32.1',
    'pydantic==2.10.4; python_version < "3.14"',
    'pydantic==2.12.5; python_version >= "3.14"',
    'pydantic-settings==2.7.0',
    'email-validator==2.2.0',
    'SQLAlchemy==2.0.36; python_version < "3.14"',
    'SQLAlchemy==2.0.44; python_version >= "3.14"',
    'alembic==1.14.0',
    'psycopg[binary]==3.2.3; python_version < "3.14"',
    'psycopg[binary]==3.2.10; python_version >= "3.14"',
    'PyJWT==2.10.1',
    'bcrypt==4.2.1',
    'python-multipart==0.0.20',
    'httpx==0.28.1',
    'PyMuPDF==1.25.1',
    'python-docx==1.1.2',
    'numpy==2.2.1; python_version < "3.14"',
    'numpy==2.3.4; python_version >= "3.14"',
    'pandas==2.2.3; python_version < "3.14"',
    'pandas==2.3.3; python_version >= "3.14"',
    'scikit-learn==1.6.0; python_version < "3.14"',
    'scikit-learn==1.7.2; python_version >= "3.14"',
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 135
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I001", "UP"]
# Curated data tables and long user-facing messages
"app/ml/taxonomy.py" = ["E501"]
"app/ml/learning_resources.py" = ["E501"]
"app/ml/job_parser.py" = ["E501"]
"app/ml/profile_extractor.py" = ["E501"]
"app/integrations/jobs/demo.py" = ["E501"]
"tests/*" = ["E501"]
